# 本機開發用的 PostgreSQL。啟動：docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    ports:
      - "5432:5432"
    volumes:
      - kanban-postgres:/var/lib/postgresql/data

volumes:
  kanban-postgres:
